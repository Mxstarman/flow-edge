name: Build Flow Edge Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias flowedge -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=FlowEdge, OU=FlowEdge, O=FlowEdge, L=Unknown, S=Unknown, C=US"
          ls -la release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Copy & Prepare APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/FlowEdge-v1.0.1.apk
          cp app/build/outputs/apk/release/app-release.apk release-output/FlowEdge.apk
          ls -lh release-output

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowEdge-v1.0.1-apk
          path: release-output/FlowEdge-v1.0.1.apk
          retention-days: 30

      - name: Create GitHub Release v1.0.1
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: Flow Edge v1.0.1 (Signed Release)
          body: |
            ### 🚀 Flow Edge v1.0.1 - Fixed Mobile Installation

            This release fixes the mobile APK installation error:
            - **Signed with V1 + V2 + V3 Signatures**: Generates official cryptographic signatures compatible with all Android package installers.
            - **Non-Debug Release Build**: Eliminates `testOnly` and `debuggable` flags that caused mobile PackageInstaller rejections.
            - **Universal Manifest Compatibility**: Removed `<property>` tag and restricted permissions causing `INSTALL_PARSE_FAILED_MANIFEST_MALFORMED` on Android 8–14.
            - **Included Multi-Density Launcher Mipmaps**: Added full raster icons for all screen densities.

            #### 📥 Download:
            - **[FlowEdge-v1.0.1.apk](https://github.com/Mxstarman/flow-edge/releases/download/v1.0.1/FlowEdge-v1.0.1.apk)**
            - **[FlowEdge.apk](https://github.com/Mxstarman/flow-edge/releases/download/v1.0.1/FlowEdge.apk)**
          files: |
            release-output/FlowEdge-v1.0.1.apk
            release-output/FlowEdge.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
